project_id = "easy-latex-collaboration"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[realtime]
enabled = false
[storage]
enabled = true
file_size_limit = "25MiB"
[storage.vector]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:4318"
additional_redirect_urls = ["http://127.0.0.1:*/auth/callback/*"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
[auth.email.template.confirmation]
subject = "Confirm your Easy LaTeX account"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.magic_link]
subject = "Confirm your legacy Easy LaTeX account link"
content_path = "./supabase/templates/legacy-link.html"
[auth.email.template.recovery]
subject = "Reset your Easy LaTeX password"
content_path = "./supabase/templates/recovery.html"
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
