# Temporary development only. Both resources explicitly use the free plan.
# Render's free Postgres expires after 30 days; export test data before expiry.
services:
  - type: web
    name: easy-latex-dev-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev --ignore-scripts --workspace @easy-latex/api --include-workspace-root=false && npm run build --workspace @easy-latex/api
    startCommand: npm run github:migrate && npm run start:built --workspace @easy-latex/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: easy-latex-dev-db
          property: connectionString
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY_PATH
        value: /etc/secrets/github-app.pem

databases:
  - name: easy-latex-dev-db
    plan: free
    region: singapore
    databaseName: easy_latex
    user: easy_latex
    ipAllowList: []
